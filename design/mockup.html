<!DOCTYPE html>
<!--
  DevOps Portal — Phase 0 static mockup.
  Single file, zero external dependencies. All data is fake and lives in the
  DATA object below. Purpose: settle information architecture + interaction,
  not final visual style. Use the "Mockup controls" panel (bottom right) to
  trigger the abnormal states (daemon offline, empty state, reset).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevOps Portal — mockup</title>
<style>
  :root{
    --bg:#f6f4f8; --panel:#ffffff; --panel2:#f7f4f9; --code:#f8f6f9;
    --line:#eae5ee; --line2:#d5cede;
    --ink:#332e3e; --ink2:#6b6478; --ink3:#a29aae;
    --accent:#cf5f8d; --header:#b84a75;
    --ok:#3f9950; --warn:#a8761c; --err:#c9485e;
    --ok-t:rgba(63,153,80,.1); --warn-t:rgba(168,118,28,.1); --err-t:rgba(201,72,94,.08);
    --sc:#4066b8; /* per-section identity color; overridden on each <section> */
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  a{color:var(--sc);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .mono{font-family:var(--mono)}
  .muted{color:var(--ink2)} .faint{color:var(--ink3)}

  /* ---------- frame ---------- */
  #banner{display:none;align-items:center;gap:10px;padding:7px 16px;
          background:var(--err-t);border-bottom:1px solid var(--err);color:var(--ink);font-size:12px}
  body.offline #banner{display:flex}
  #banner .dot{background:var(--err)}
  #app{display:flex;height:100%;min-height:0}
  body.offline #app{height:calc(100% - 33px)}

  .sidebar{width:210px;min-width:210px;background:var(--panel);border-right:1px solid var(--line);
           display:flex;flex-direction:column}
  .brand{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  .brand .t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
            color:var(--header)}
  .brand .v{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:2px}
  .tabs{flex:1;overflow:auto;padding:8px 0}
  .tab{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
       padding:7px 14px;color:var(--ink2);border-left:2px solid transparent}
  .tab:hover{color:var(--ink);background:var(--panel2)}
  .tab.on{color:var(--ink);background:var(--panel2);border-left-color:var(--accent)}
  .tab .sq{width:22px;height:22px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);
           display:flex;align-items:center;justify-content:center;
           font-family:var(--mono);font-size:11px;color:var(--ink2);flex:none}
  .tab.on .sq{color:var(--accent);border-color:var(--accent)}
  .tab .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-foot{border-top:1px solid var(--line);padding:6px 0}
  .side-note{padding:8px 16px 10px;font-size:10px;color:var(--ink3);line-height:1.5}

  .main-col{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;
          gap:12px;padding:0 16px;background:var(--header)}
  .topbar .l{display:flex;align-items:baseline;gap:10px;min-width:0}
  .topbar .name{font-size:14px;font-weight:600;white-space:nowrap;color:#fff}
  .topbar .name.muted{color:rgba(255,255,255,.7)}
  .topbar .repo{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.65);
                white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .r{display:flex;align-items:center;gap:10px;flex:none}
  .topbar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5);color:#fff}
  .topbar .btn:hover{background:rgba(255,255,255,.24);border-color:#fff;color:#fff}
  .topbar .chip,.topbar .chip.ok,.topbar .chip.err{
    border-color:rgba(255,255,255,.55);color:#fff;background:rgba(255,255,255,.12)}

  .content{flex:1;overflow:auto;padding:16px}
  .inner{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:13px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:13px;align-items:start}
  .col{display:flex;flex-direction:column;gap:13px;min-width:0}
  @media (max-width:1100px){.cols{grid-template-columns:1fr}}

  /* ---------- primitives ---------- */
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  .dot.ok{background:var(--ok)} .dot.err{background:var(--err)}
  .dot.warn{background:var(--warn)} .dot.off{background:none;border:1.5px solid var(--ink3)}
  @media (prefers-reduced-motion:no-preference){
    .dot.err.blink{animation:blink 1.6s ease-in-out infinite}
    @keyframes blink{50%{opacity:.35}}
  }
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;
        padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);
        white-space:nowrap}
  .chip.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-t)}
  .chip.err{border-color:var(--err);color:var(--err);background:var(--err-t)}
  .chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-t)}

  .btn{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;
       border:1px solid var(--line2);border-radius:5px;color:var(--ink2);background:var(--panel);
       white-space:nowrap}
  .btn:hover{color:var(--ink);border-color:var(--ink3)}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  body.offline .btn:not(.demo-safe){opacity:.35;pointer-events:none}

  .badge{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;
         padding:1px 7px;border-radius:4px}
  .badge.add{color:var(--ok);background:var(--ok-t)}
  .badge.mod{color:var(--warn);background:var(--warn-t)}
  .badge.del{color:var(--err);background:var(--err-t)}

  /* ---------- sections ---------- */
  .section{background:var(--panel);border:1px solid var(--line);border-radius:10px;
           box-shadow:0 1px 2px rgba(51,46,62,.06)}
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
            padding:8px 14px;background:var(--sc);border-radius:9px 9px 0 0}
  .sec-title{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;
             letter-spacing:.09em;text-transform:uppercase;color:#fff}
  .sec-title .tt{white-space:nowrap}
  .sec-title .sum{color:rgba(255,255,255,.72)}
  .sec-icon{width:24px;height:24px;border-radius:7px;flex:none;
            display:flex;align-items:center;justify-content:center;
            background:rgba(255,255,255,.18);color:#fff}
  .sec-head a{color:#fff}
  .sec-head .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5);color:#fff}
  .sec-head .btn:hover{background:rgba(255,255,255,.24);border-color:#fff;color:#fff}

  /* drag-to-reorder */
  .grip{display:flex;align-items:center;padding:2px 3px;margin:-2px 0 -2px -4px;
        cursor:grab;color:rgba(255,255,255,.55);border-radius:4px}
  .grip:hover{color:#fff;background:rgba(255,255,255,.14)}
  .section.dragging{opacity:.4}
  .section.drop-before{box-shadow:0 -3px 0 0 var(--accent),0 1px 2px rgba(51,46,62,.06)}
  .section.drop-after{box-shadow:0 3px 0 0 var(--accent),0 1px 2px rgba(51,46,62,.06)}
  body.dragging-layout .col[data-zone]{outline:2px dashed var(--line2);outline-offset:3px;
        border-radius:10px;min-height:34px}
  .cols .rev-grid{grid-template-columns:1fr}
  .sec-title .sum{font-weight:400;letter-spacing:0;text-transform:none;font-family:var(--mono);
                  font-size:10.5px;color:var(--ink3)}
  .sec-tools{display:flex;align-items:center;gap:8px}
  .deeplink{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px}
  .sec-body{padding:11px 14px}

  /* store versions band (what is live on the market right now) */
  .verband{display:flex}
  .store{flex:1;min-width:0;padding:11px 16px;border-left:1px solid var(--line);
         display:flex;flex-direction:column;gap:2px}
  .store:first-child{border-left:none}
  .store .eyebrow{display:flex;align-items:center;justify-content:space-between;
                  font-size:9.5px;font-weight:700;text-transform:uppercase;
                  letter-spacing:.1em;color:var(--ink3)}
  .store .ver{display:flex;align-items:center;gap:9px;font-family:var(--mono);
              font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .store .vnote{font-size:11px;color:var(--ink2)}
  .store .vsub{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}

  /* alerts */
  .recent-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);
              margin:8px 0 3px;padding-top:8px;border-top:1px solid var(--line)}

  /* store reviews */
  .rev-grid{display:grid;grid-template-columns:1fr 1.35fr;gap:20px}
  @media (max-width:1100px){.rev-grid{grid-template-columns:1fr}}
  .rating-row{display:flex;align-items:baseline;gap:8px}
  .rating-row .rv{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .stars{color:var(--sc);letter-spacing:.5px}
  .sent{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:8px 0 4px;background:var(--line)}
  .sent i{height:100%}
  .theme-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12px}
  .theme-row + .theme-row{border-top:1px solid var(--line)}
  .rrow{padding:7px 0}
  .rrow + .rrow{border-top:1px solid var(--line)}
  .rmeta{display:flex;gap:9px;align-items:center;font-family:var(--mono);font-size:10px;color:var(--ink3)}
  .rtext{font-size:12px;margin-top:3px}

  /* processes */
  .prow{display:flex;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
  .prow:first-child{border-top:none}
  .prow .info{flex:1;min-width:0}
  .prow .lbl{font-weight:600}
  .prow .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
  .prow .alert{font-size:11px;color:var(--err);margin-top:2px}
  .prow .st{width:92px;font-family:var(--mono);font-size:10.5px;color:var(--ink2);
            display:flex;align-items:center;gap:6px;flex:none}
  .prow .up{width:62px;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--ink2);flex:none}
  .prow .acts{display:flex;gap:6px;flex:none}
  .logbox{background:var(--code);border:1px solid var(--line);border-radius:6px;
          font-family:var(--mono);font-size:10.5px;line-height:1.7;color:var(--ink2);
          padding:8px 12px;margin:2px 0 8px 20px;overflow-x:auto;white-space:pre}
  .logbox .e{color:var(--err)}
  .chev{transition:transform .12s}
  .chev.open{transform:rotate(90deg)}

  /* flags */
  .drow{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
  .drow:first-child{border-top:none}
  .drow .key{font-family:var(--mono);font-size:12px;min-width:150px}
  .drow .chg{font-family:var(--mono);font-size:11px;color:var(--ink2);flex:1;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .flags-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
              margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .sync-ok{display:flex;align-items:center;gap:9px;color:var(--ink2);padding:4px 0}

  /* pipeline rail (publish flow) */
  .rail{display:flex;align-items:flex-start;padding:10px 4px 2px}
  .rnode{display:flex;flex-direction:column;align-items:center;width:112px;flex:none;text-align:center}
  .rnode .c{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);
            display:flex;align-items:center;justify-content:center;
            font-size:12px;color:var(--ink3);background:var(--panel)}
  .rnode .rl{font-size:10.5px;color:var(--ink2);margin-top:6px}
  .rnode .rs{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:1px}
  .rnode.done .c{border-color:var(--ok);color:var(--ok)}
  .rnode.fail .c{border-color:var(--err);color:var(--err);background:var(--err-t)}
  .rnode.act .c{border-color:var(--sc);color:var(--sc)}
  @media (prefers-reduced-motion:no-preference){
    .rnode.act .c{animation:blink 1.2s ease-in-out infinite}
  }
  .rconn{flex:1;height:2px;background:var(--line2);margin-top:11px;min-width:10px}
  .rconn.done{background:var(--ok)}
  .pub-end{display:flex;align-items:center;justify-content:space-between;gap:10px;
           margin-top:12px;padding:8px 12px;border-radius:6px;font-size:12px}
  .pub-end.okend{background:var(--ok-t);border:1px solid var(--ok)}
  .pub-end.errend{background:var(--err-t);border:1px solid var(--err)}

  /* cards / grids */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 12px;
        display:flex;flex-direction:column;gap:3px}
  .card .cl{font-weight:600;font-size:12.5px}
  .card .cs{font-family:var(--mono);font-size:10px;color:var(--ink3)}
  .iframe-slot{margin-top:10px;border:1px dashed var(--line2);border-radius:6px;padding:22px;
               text-align:center;color:var(--ink3);font-family:var(--mono);font-size:10.5px;line-height:1.8}

  .conns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:11px}
  .conn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 12px;
        display:flex;flex-direction:column;gap:6px}
  .conn .top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .conn .nm{font-weight:600;font-size:12.5px}
  .conn .hint{font-size:10.5px;color:var(--ink3);line-height:1.45}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
  .kpi .kl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
  .kpi .kv{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;
           margin-top:3px}
  .kpi .kd{font-family:var(--mono);font-size:10px;color:var(--ink2);margin-top:2px}
  .cache-note{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:8px}

  /* release */
  .wf{border-top:1px solid var(--line);padding:9px 0}
  .wf:first-child{border-top:none;padding-top:2px}
  .wf-head{display:flex;align-items:center;gap:10px}
  .wf-head .id{font-family:var(--mono);font-size:12px}
  .wf-head .wl{color:var(--ink2);font-size:11.5px;flex:1}
  .run{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;
       color:var(--ink2);padding:3px 0 3px 18px}
  .run .rn{width:44px}
  .run .rst{width:74px;display:flex;align-items:center;gap:6px}
  .run .sha{color:var(--ink3);width:70px}
  .run .dur{width:64px;text-align:right}
  .run .when{color:var(--ink3)}
  .phased{margin-top:11px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);
          border-radius:6px;display:flex;align-items:center;gap:14px}
  .phased .seg{display:flex;gap:3px}
  .phased .seg i{width:16px;height:8px;border-radius:2px;background:var(--line2)}
  .phased .seg i.f{background:var(--accent)}
  .phased.paused .seg i.f{background:var(--warn)}
  .phased .pt{flex:1;font-size:12px}
  .phased .pt .sub{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:1px}

  /* settings */
  .srow{display:flex;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
  .srow:first-child{border-top:none}
  .srow .sn{font-family:var(--mono);font-size:12px;min-width:190px}
  .srow .sp{flex:1;font-size:11.5px;color:var(--ink2)}
  .note-line{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
             font-size:11px;color:var(--ink3);line-height:1.6}
  .note-line code{font-family:var(--mono);color:var(--ink2)}
  .mrow .err-msg{font-family:var(--mono);font-size:10.5px;color:var(--err);margin-top:2px}
  .kv-grid{display:grid;grid-template-columns:130px 1fr;gap:4px 14px;
           font-size:12px;color:var(--ink2)}
  .kv-grid dt{color:var(--ink3);text-transform:uppercase;font-size:10px;letter-spacing:.07em;
              padding-top:2px}
  .kv-grid dd{margin:0;font-family:var(--mono);font-size:11.5px}

  /* empty state */
  .empty{margin:60px auto;max-width:520px;text-align:center}
  .empty h2{font-size:16px;margin:0 0 8px}
  .empty p{color:var(--ink2);margin:0 0 16px}
  .empty pre{text-align:left;background:var(--code);border:1px solid var(--line);border-radius:8px;
             padding:14px 16px;font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--ink2);
             overflow-x:auto}
  .empty pre .c{color:var(--ink3)}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(46,40,58,.35);display:none;
           align-items:center;justify-content:center;z-index:50}
  .overlay.open{display:flex}
  .modal{width:460px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);
         border-radius:10px;padding:16px 18px}
  .modal h3{margin:0 0 10px;font-size:13.5px}
  .modal .mb{color:var(--ink2);font-size:12.5px;line-height:1.6}
  .modal .mb ul{margin:8px 0;padding-left:18px}
  .modal .mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .modal label{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:11.5px;color:var(--ink3)}

  /* demo panel */
  .demo{position:fixed;right:14px;bottom:14px;z-index:40;background:var(--panel);
        border:1px solid var(--line2);border-radius:8px;padding:9px 12px;width:172px;
        box-shadow:0 2px 8px rgba(51,46,62,.12)}
  .demo .dt{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
            color:var(--ink3);margin-bottom:6px}
  .demo label{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2);
              padding:3px 0;cursor:pointer}
  .demo .btn{margin-top:7px;width:100%;justify-content:center}
  input[type=checkbox]{accent-color:var(--accent)}
</style>
</head>
<body>

<div id="banner" role="alert">
  <span class="dot err blink"></span>
  <strong>Daemon unreachable.</strong>
  <span class="muted">Actions are disabled; showing last known state. Retrying every 5 s —
  check <span class="mono">portal daemon status</span> on this machine.</span>
  <button class="btn demo-safe" style="margin-left:auto" onclick="App.retryDaemon()">Retry now</button>
</div>

<div id="app">
  <nav class="sidebar">
    <div class="brand">
      <div class="t">DevOps Portal</div>
      <div class="v">v0 &middot; phase-0 mockup</div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="side-foot" id="sidefoot"></div>
    <div class="side-note">Thin shell &mdash; every section deep-links into the tool that owns it.</div>
  </nav>

  <div class="main-col">
    <header class="topbar">
      <div class="l" id="tb-left"></div>
      <div class="r">
        <span id="daemon-chip"></span>
        <button class="btn demo-safe" id="tb-settings" onclick="App.go('settings')" title="Settings">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="2.6"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4"/></svg>
          Settings
        </button>
      </div>
    </header>
    <main class="content"><div class="inner" id="view"></div></main>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
</div>

<aside class="demo">

function procStatus(p){
  if (state.offline) return '<span class="dot off"></span> unknown';
  const s = PSTATUS[p.status] || PSTATUS.pending;
  const label = p.status === "pending" ? (p.pendingLabel || "…") : s.label;
  return '<span class="dot '+s.dot+'"></span> '+label;
}

function aggDot(p){
  if (state.offline) return "off";
  const st = p.processes.map(x => x.status);
  if (st.includes("unhealthy")) return "err";
  if (st.every(x => x === "running")) return "ok";
  if (st.every(x => x === "stopped")) return "off";
  return "warn";
}

function runDot(s){ return s==="success" ? "ok" : s==="failed" ? "err" : "warn"; }

  const lay = layoutOf(p.id);

    '<div class="cols">'+

function verBand(p){
  const cells = p.stores.map(s => {
    let ver = "—", chip = '<span class="chip">not published</span>';
    if (s.state === "live"){ ver = "v"+s.version; chip = '<span class="chip ok">live</span>'; }
    else if (s.state === "not_configured"){ chip = '<span class="chip warn">not configured</span>'; }
    return '<div class="store">'+
      '<div class="eyebrow"><span>'+s.store+' · '+s.os+'</span>'+
      (s.url ? '<a href="'+s.url+'" target="_blank" rel="noopener" aria-label="Open '+s.store+'">'+EXT+'</a>' : '')+
      '</div>'+
      '<div class="ver">'+ver+' '+chip+'</div>'+
      (s.note ? '<div class="vnote">'+s.note+'</div>' : '')+
      (s.sub ? '<div class="vsub">'+s.sub+'</div>' : '')+
      '</div>';
  }).join("");
  return secWrap("stores", "verband")+cells+'</section>';
}

function secServers(p){
  const running = p.processes.filter(x => x.status === "running").length;
  const rows = p.processes.map(x => {
    const open = state.expanded.has(p.id+"/"+x.name);
    const acts = [];
    if (x.status === "running" || x.status === "unhealthy"){
      acts.push('<button class="btn" onclick="App.proc(\''+p.id+'\',\''+x.name+'\',\'restart\')">Restart</button>');
      acts.push('<button class="btn" onclick="App.proc(\''+p.id+'\',\''+x.name+'\',\'stop\')">Stop</button>');
    } else if (x.status === "stopped"){
      acts.push('<button class="btn" onclick="App.proc(\''+p.id+'\',\''+x.name+'\',\'start\')">Start</button>');
    }
    acts.push('<a class="btn" href="http://localhost:'+x.port+'" target="_blank" rel="noopener">Open '+EXT+'</a>');
    acts.push('<button class="btn" onclick="App.toggleLog(\''+p.id+'\',\''+x.name+'\')">'+CHEV(open)+' Logs</button>');
    return '<div class="prow">'+
      '<div class="st">'+procStatus(x)+'</div>'+
      '<div class="info"><span class="lbl">'+x.label+'</span> '+
        '<span class="meta">'+x.name+' · :'+x.port+'</span>'+
        (x.alert && !state.offline ? '<div class="alert">⚠ '+x.alert+'</div>' : "")+
      '</div>'+
      '<div class="up">'+(x.uptime && x.status!=="stopped" ? x.uptime : "—")+'</div>'+
      '<div class="acts">'+acts.join("")+'</div>'+
    '</div>'+
    (open ? '<div class="logbox">'+x.log.map(l =>
        /ERROR|500/.test(l) ? '<span class="e">'+l+'</span>' : l).join("\n")+'</div>' : "");
  }).join("");

  return secWrap("servers")+
    secHead("servers", "Local Servers", running+"/"+p.processes.length+" running",
      '<button class="btn" onclick="App.bulk(\''+p.id+'\',\'start\')">Start all</button>'+
      '<button class="btn" onclick="App.bulk(\''+p.id+'\',\'stop\')">Stop all</button>'+
      deeplink("http://localhost:8080", "process-compose"))+
    '<div class="sec-body">'+rows+'</div></section>';
}

/* ---------- flags ---------- */

function secFlags(p){
  const st = pub[p.id];
  const n = p.flags.diff.length;
  let body = "";

  if (st.stage === "diff" && n === 0) st.stage = "clean";

  if (st.stage === "diff"){
    body = p.flags.diff.map(d =>
      '<div class="drow"><span class="badge '+d.kind+'">'+
        (d.kind==="add"?"added":d.kind==="mod"?"modified":"removed")+'</span>'+
        '<span class="key">'+d.key+'</span><span class="chg">'+d.chg+'</span></div>').join("")+
      '<div class="flags-foot"><span class="mono faint" style="font-size:10.5px">'+
        n+' change'+(n>1?"s":"")+' vs cloud · last sync '+p.flags.lastSync+'</span>'+
      '<span style="display:flex;gap:8px">'+
        '<button class="btn primary" onclick="App.openPublish(\''+p.id+'\')">Publish to cloud…</button>'+
      '</span></div>';
  }
  else if (st.stage === "clean"){
    body = '<div class="sync-ok"><span class="dot ok"></span>Local and cloud are in sync — nothing to publish.'+
           '<span class="mono faint" style="font-size:10.5px">last sync '+p.flags.lastSync+'</span></div>';
  }
  else {
    body = rail(st) + railEnd(p, st);
  }

  return secWrap("flags")+
    secHead("flags", "Feature Flags", "publish is git-gated: export → commit → CI → cloud",
      deeplink("http://localhost:"+(p.gbPort||3100), "GrowthBook"))+
    '<div class="sec-body">'+body+'</div></section>';
}

function rail(st){
  const runNo = st.runNo || 124;
  return '<div class="rail">'+PUB_STEPS.map((s,i) => {
    let cls = "", mark = String(i+1);
    if (st.stage === "success" || (st.stage !== "failed" && i < st.step)) { cls = "done"; mark = "✓"; }
    else if (st.stage === "failed"){
      if (i < st.failedAt){ cls = "done"; mark = "✓"; }
      else if (i === st.failedAt){ cls = "fail"; mark = "×"; }
    }
    else if (st.stage === "running" && i === st.step){ cls = "act"; }
    const sub = i === 2
      ? '<a href="https://github.com/you/product/actions" target="_blank" rel="noopener">run #'+runNo+' '+EXT+'</a>'
      : (s.sub || "&nbsp;");
    const conn = i ? '<div class="rconn '+(cls==="done"||(st.stage==="success")?"done":"")+'"></div>' : "";
    return conn+'<div class="rnode '+cls+'"><div class="c">'+mark+'</div>'+
           '<div class="rl">'+s.label+'</div><div class="rs">'+sub+'</div></div>';
  }).join("")+'</div>';
}

function railEnd(p, st){
  if (st.stage === "running")
    return '<div class="mono faint" style="font-size:10.5px;margin-top:10px">publishing… this panel tracks the CI run; safe to leave the page.</div>';
  if (st.stage === "success")
    return '<div class="pub-end okend"><span><strong>Published.</strong> Cloud now matches local · commit <span class="mono">ab3f21c</span> · run #'+(st.runNo||124)+'</span>'+
           '<button class="btn" onclick="App.pubDone(\''+p.id+'\')">Done</button></div>';
  if (st.stage === "failed")
    return '<div class="pub-end errend"><span><strong>Publish failed.</strong> '+st.error+'</span>'+
           '<span style="display:flex;gap:8px;flex:none">'+
           '<a class="btn" href="https://github.com/you/product/actions" target="_blank" rel="noopener">CI log '+EXT+'</a>'+
           '<button class="btn primary" onclick="App.startPublish(\''+p.id+'\',false)">Retry</button></span></div>';
  return "";
}

/* ---------- release ---------- */

function secRelease(p){
  const wfs = p.workflows.map(w => {
    const runs = w.runs.slice(0,5).map(r =>
      '<div class="run"><span class="rn">#'+r.n+'</span>'+
      '<span class="rst"><span class="dot '+(r.status==="running"?"warn":runDot(r.status))+'"></span>'+r.status+'</span>'+
      '<span class="sha">'+r.sha+'</span><span class="dur">'+r.dur+'</span>'+
      '<span class="when">'+r.when+'</span></div>').join("")
      || '<div class="run faint">no runs yet</div>';
    return '<div class="wf"><div class="wf-head">'+
      '<span class="id">'+w.id+'</span><span class="wl">'+w.label+'</span>'+
      '<button class="btn" onclick="App.openDispatch(\''+p.id+'\',\''+w.id+'\')">Dispatch…</button>'+
      '</div>'+runs+'</div>';
  }).join("");

  let phased = "";
  if (p.phased){
    const ph = p.phased;
    const segs = Array.from({length: ph.of}, (_,i) =>
      '<i class="'+(i < ph.day ? "f" : "")+'"></i>').join("");
    phased = '<div class="phased'+(ph.paused?" paused":"")+'">'+
      '<span class="seg">'+segs+'</span>'+
      '<span class="pt">iOS phased release — v'+ph.version+
        (ph.paused ? ' <span class="chip warn">paused</span>' : '')+
        '<div class="sub">day '+ph.day+' of '+ph.of+' · '+ph.pct+' of users · via ASC API</div></span>'+
      '<button class="btn" onclick="App.togglePhased(\''+p.id+'\')">'+(ph.paused?"Resume":"Pause")+'</button>'+
      '</div>';
  } else {
    phased = '<div class="cache-note" style="margin-top:10px">no staged rollout in progress</div>';
  }

  return secWrap("release")+
    secHead("release", "Release", "workflow_dispatch · last 5 runs",
      deeplink("https://github.com/"+p.repo+"/actions", "GitHub Actions"))+
    '<div class="sec-body">'+wfs+phased+'</div></section>';
}

      'No store presence yet — the daemon starts collecting reviews automatically once the app '+
      'is live on a store, using the same credentials as the versions band above.</div>';
  } else {
    tools = r.links.map(l => deeplink(l.url, l.label)).join("");
    const ratings = r.ratings.map(x =>
      '<div class="rating-row"><span class="rv">'+x.value+'</span><span class="stars">★</span>'+
      '<span class="muted" style="font-size:11px">'+x.store+' · '+x.count+' total · +'+x.fresh+' this week</span></div>').join("");
    const s = r.sentiment, tot = s.pos + s.neu + s.neg;
    const pct = n => (n / tot * 100).toFixed(1);
    const sent = '<div class="sent">'+
      '<i style="width:'+pct(s.pos)+'%;background:var(--ok)"></i>'+
      '<i style="width:'+pct(s.neu)+'%;background:var(--line2)"></i>'+

    const themes = r.themes.map(t =>
      '<div class="theme-row"><span class="dot '+(t.tone==="pos"?"ok":t.tone==="neg"?"err":"off")+'"></span>'+
      '<span style="flex:1">'+t.label+'</span>'+
      '<span class="mono faint">×'+t.n+' '+t.trend+'</span></div>').join("");
    const collect =
      '<div class="recent-lbl">Collection</div>'+
      '<div class="mono faint" style="font-size:10.5px;line-height:1.7">'+
        'collected '+r.schedule+' by the daemon · last run '+r.lastCollected+'<br>'+
        'Play reviews API only looks back 7 days — daily collection means nothing is lost'+
        (r.gap ? '<br><span style="color:var(--warn)">'+r.gap+'</span>' : '')+
      '</div>'+
      '<button class="btn" style="margin-top:8px" onclick="App.collectReviews(\''+p.id+'\')">'+

    const recent = r.recent.map(x =>
      '<div class="rrow"><div class="rmeta">'+

}

/* ------------------------------------------------------------------ actions */

function go(tab){ state.tab = tab; render(); }

function toggleLog(pid, name){
  const k = pid+"/"+name;
  state.expanded.has(k) ? state.expanded.delete(k) : state.expanded.add(k);
  render();
}

function proc(pid, name, action){
  const x = prod(pid).processes.find(z => z.name === name);
  x.status = "pending";
  x.pendingLabel = action === "stop" ? "stopping…" : action === "start" ? "starting…" : "restarting…";
  render();
  later(() => {
    x.status = action === "stop" ? "stopped" : "running";
    x.uptime = action === "stop" ? null : "just now";
    delete x.alert;
    render();
  }, 900);
}

function bulk(pid, action){
  prod(pid).processes.forEach(x => {
    const idle = x.status === "stopped";
    if ((action === "start" && idle) || (action === "stop" && !idle)) proc(pid, x.name, action);
  });
}

/* publish */

function openPublish(pid){
  const p = prod(pid), n = p.flags.diff.length;
  openModal({
    title: "Publish flags to cloud — "+p.name,
    body: '<div class="mb">'+n+' change'+(n>1?"s":"")+' will go through the git-gated chain: '+
      'export → commit → GitHub Actions → GrowthBook Cloud. Every publish is a commit — auditable and revertable.'+
      '<ul>'+p.flags.diff.map(d=>'<li><span class="mono">'+d.key+'</span> — '+d.chg+'</li>').join("")+'</ul></div>'+
      '<label><input type="checkbox" id="mock-fail"> mockup: simulate a CI failure</label>',
    confirm: "Publish",
    onConfirm(){
      startPublish(pid, document.getElementById("mock-fail").checked);
    },
  });
}

function startPublish(pid, fail){
  pub[pid] = { stage:"running", step:0, fail, runNo:(pub[pid].runNo||123)+1 };
  render();
  tick(pid);
}

function tick(pid){
  const st = pub[pid];
  if (st.stage !== "running") return;
  later(() => {
    if (st.fail && st.step === 2){
      st.stage = "failed"; st.failedAt = 2;
      st.error = "Run #"+st.runNo+" failed at 'Push to GrowthBook Cloud' — HTTP 429, feature API rate limit (60 req/min). Nothing was partially applied.";
    } else if (st.step >= PUB_STEPS.length - 1){
      st.stage = "success";
    } else {
      st.step += 1;
    }
    render();
    tick(pid);
  }, 1100);
}

function pubDone(pid){
  prod(pid).flags.diff = [];
  prod(pid).flags.lastSync = "just now · run #"+(pub[pid].runNo||124)+" · ab3f21c";
  pub[pid] = { stage:"clean" };
  render();
}

/* release */

function openDispatch(pid, wfId){
  const p = prod(pid);
  openModal({
    title: "Dispatch workflow",
    body: '<div class="mb">Run <span class="mono">'+wfId+'</span> on '+
          '<span class="mono">'+p.repo+'@main</span> via workflow_dispatch?</div>',
    confirm: "Dispatch",
    onConfirm(){
      const w = p.workflows.find(z => z.id === wfId);
      const n = Math.max(0, ...p.workflows.flatMap(z => z.runs.map(r => r.n))) + 1;
      const run = { n, status:"running", dur:"—", sha:"HEAD", when:"just now" };
      w.runs.unshift(run);
      render();
      later(() => { run.status = "success"; run.dur = "41s"; render(); }, 4000);
    },
  });
}

function togglePhased(pid){
  const ph = prod(pid).phased;
  ph.paused = !ph.paused;
  render();
}

function testPing(pid){
  const a = prod(pid).alerts;
  a.pinged = true;
  render();
  later(() => { a.pinged = false; render(); }, 2200);
}

function collectReviews(pid){
  const r = prod(pid).reviews;
  r.busy = true;
  render();
  later(() => { r.busy = false; r.lastCollected = "just now"; render(); }, 1400);
}

/* layout: drag sections between/within the three drop zones; order kept per product */

const DEFAULT_LAYOUT = { left:["servers","flags","dash"], right:["release","revenue","alerts"], bottom:["reviews"] };
let dragKey = null;

function layoutOf(pid){
  if (!state.layout[pid]) state.layout[pid] = JSON.parse(JSON.stringify(DEFAULT_LAYOUT));
  return state.layout[pid];
}

function dragStart(e, key){
  dragKey = key;
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", key); } catch(_){}
  const sec = e.target.closest(".section");
  if (sec){
    e.dataTransfer.setDragImage(sec, 24, 16);
    requestAnimationFrame(() => sec.classList.add("dragging"));
  }
  document.body.classList.add("dragging-layout");
}

function clearDragMarks(){
  document.querySelectorAll(".drop-before,.drop-after").forEach(el =>
    el.classList.remove("drop-before","drop-after"));
}

function dragEnd(){
  document.body.classList.remove("dragging-layout");
  clearDragMarks();
  document.querySelectorAll(".section.dragging").forEach(el => el.classList.remove("dragging"));
  dragKey = null;
}

function targetIndex(container, y){
  const kids = [...container.children].filter(el =>
    el.classList.contains("section") && !el.classList.contains("dragging"));
  let i = 0;
  for (const k of kids){
    const r = k.getBoundingClientRect();
    if (y > r.top + r.height/2) i++; else break;
  }
  return { i, kids };
}

function dragOver(e){
  if (!dragKey) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  const { i, kids } = targetIndex(e.currentTarget, e.clientY);
  clearDragMarks();
  if (kids[i]) kids[i].classList.add("drop-before");
  else if (kids.length) kids[kids.length-1].classList.add("drop-after");
}

function dragLeave(e){
  if (e.currentTarget.contains(e.relatedTarget)) return;
  clearDragMarks();
}

function drop(e, zone){
  if (!dragKey) return;
  e.preventDefault();
  const { i } = targetIndex(e.currentTarget, e.clientY);
  moveSec(dragKey, zone, i);
  dragEnd();
}

/* the real system persists this per product (daemon ui-state); mockup keeps it in memory */
function moveSec(key, zone, i){
  const lay = layoutOf(state.tab);
  ["left","right","bottom"].forEach(z => { lay[z] = lay[z].filter(k => k !== key); });
  lay[zone].splice(i, 0, key);
  render();
}

/* modal */

function openModal({title, body, confirm, onConfirm}){
  modalConfirm = onConfirm;
  document.getElementById("modal").innerHTML =
    '<h3>'+title+'</h3>'+body+
    '<div class="mfoot"><button class="btn" onclick="App.closeModal()">Cancel</button>'+
    '<button class="btn primary" onclick="App.confirmModal()">'+confirm+'</button></div>';
  document.getElementById("overlay").classList.add("open");
}
function closeModal(){ document.getElementById("overlay").classList.remove("open"); modalConfirm = null; }
function confirmModal(){ const f = modalConfirm; closeModal(); if (f) f(); }

/* demo controls */

function setOffline(v){ state.offline = v; render(); }
function setEmpty(v){ state.empty = v; render(); }
function retryDaemon(){
  state.offline = false;
  document.getElementById("ck-offline").checked = false;
  render();
}
function resetMock(){
  clearTimers();
  const s = JSON.parse(SNAPSHOT);
  data = s.d; pub = s.p;
  state.tab = "lumen"; state.offline = false; state.empty = false;
  state.expanded = new Set(); state.layout = {};
  document.getElementById("ck-offline").checked = false;
  document.getElementById("ck-empty").checked = false;
  render();
}

/* ------------------------------------------------------------------ boot */

document.getElementById("overlay").addEventListener("click", e => {
  if (e.target.id === "overlay") closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

render();

return { go, toggleLog, proc, bulk, openPublish, startPublish, pubDone,
         openDispatch, togglePhased, testPing, collectReviews, openModal, closeModal,
         confirmModal, setOffline, setEmpty, retryDaemon, resetMock,
         dragStart, dragEnd, dragOver, dragLeave, drop, moveSec };
})();
</script>
