<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cherry-ops</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="banner" role="alert">
  <span class="dot err blink"></span>
  <strong>Daemon unreachable.</strong>
  <span class="muted">Actions are disabled; showing last known state. Retrying every 5&nbsp;s.</span>
</div>

<div id="app">
  <nav class="sidebar">
    <div class="brand">
      <div class="t">cherry-ops</div>
      <div class="v" id="brand-ver">v0.1.0</div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="side-foot" id="sidefoot"></div>
    <div class="side-note">Thin shell &mdash; every section deep-links into the tool that owns it.
      No project data lives in the app itself.</div>
  </nav>

  <div class="main-col">
    <header class="topbar">
      <div class="l" id="tb-left"></div>
      <div class="r">
        <span id="daemon-chip"></span>
        <button class="btn" id="tb-settings" onclick="App.go('settings')" title="Settings">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="2.6"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4"/></svg>
          Settings
        </button>
      </div>
    </header>
    <main class="content"><div class="inner" id="view"></div></main>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
</div>

<script src="app.js"></script>
</body>
</html>
